services:
  redis:
    container_name: redis-dev

  backend:
    build:
      target: development
    image: vincent/backend:dev
    container_name: backend-dev
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./backend/src:/app/src
      - ./backend/precomputed:/app/precomputed

  frontend:
    build:
      target: development
      args:
        VITE_GENERATE_SOURCEMAP: "true"
    image: vincent/frontend:dev
    container_name: frontend-dev
    ports:
      - "${VITE_PORT}:${VITE_PORT}"
    volumes:
      - ./frontend/src:/app/src

  celery_worker:
    image: vincent/backend:dev
    container_name: celery-dev
    volumes:
      - ./backend/src:/app/src
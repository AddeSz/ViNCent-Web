services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      args:
        BACKEND_PORT: ${BACKEND_PORT}
        ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    container_name: backend
    image: vincent/backend
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    restart: unless-stopped
    networks:
      - network
    volumes:
      - ./backend/precomputed:/app/precomputed
    profiles: ["prod"]

  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
      args:
        BACKEND_PORT: ${BACKEND_PORT}
        ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    container_name: backend-dev
    image: vincent/backend:dev
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    restart: unless-stopped
    networks:
      - network
    volumes:
      - ./backend/src:/app/src
      - ./backend/precomputed:/app/precomputed
    profiles: ["dev"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
        VITE_PORT: ${VITE_PORT}
        VITE_GENERATE_SOURCEMAP: ${VITE_GENERATE_SOURCEMAP:-false}
    container_name: frontend
    image: vincent/frontend
    ports:
      - "${VITE_PORT}:${VITE_PORT}"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - network
    environment:
      VITE_BACKEND_URL: ${VITE_BACKEND_URL}
      VITE_PORT: ${VITE_PORT}
    profiles: ["prod"]

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
        VITE_PORT: ${VITE_PORT}
        VITE_GENERATE_SOURCEMAP: true
    container_name: frontend-dev
    image: vincent/frontend:dev
    ports:
      - "${VITE_PORT}:${VITE_PORT}"
    depends_on:
      - backend-dev
    restart: unless-stopped
    networks:
      - network
    volumes:
      - ./frontend/src:/app/src
    profiles: ["dev"]

networks:
  network:
    driver: bridge
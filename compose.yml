services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    networks:
      - network
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BACKEND_PORT: ${BACKEND_PORT}
        ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    container_name: backend
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - network
    volumes:
      - ./backend/precomputed:/app/precomputed

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
        VITE_PORT: ${VITE_PORT}
    container_name: frontend
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - network

  celery_worker:
    command: celery -A src.worker worker --loglevel=info
    container_name: celery-worker
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - network

networks:
  network:
    driver: bridge

volumes:
  redis_data:
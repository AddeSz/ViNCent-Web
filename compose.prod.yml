services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    networks:
      - network
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
      args:
        BACKEND_PORT: ${BACKEND_PORT}
        ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
    image: vincent/backend
    container_name: backend
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - network
    volumes:
      - ./backend/precomputed:/app/precomputed
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      CELERY_BACKEND_URL: ${CELERY_BACKEND_URL}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
        VITE_PORT: ${VITE_PORT}
        VITE_GENERATE_SOURCEMAP: ${VITE_GENERATE_SOURCEMAP:-false}
    container_name: frontend
    image: vincent/frontend
    ports:
      - "${VITE_PORT}:${VITE_PORT}"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - network
    environment:
      VITE_BACKEND_URL: ${VITE_BACKEND_URL}
      VITE_PORT: ${VITE_PORT}

  celery_worker:
    image: vincent/backend
    command: celery -A src.worker worker --loglevel=info
    container_name: celery-worker
    env_file: .env
    depends_on:
      redis:
        condition: service_started
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - network
      
networks:
  network:
    driver: bridge

volumes:
  redis_data:
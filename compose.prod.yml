services:
  backend:
    build:
      target: production
    image: vincent/backend:prod
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"

  frontend:
    build:
      target: production
      args:
        VITE_GENERATE_SOURCEMAP: "false"
    image: vincent/frontend:prod
    ports:
      - "${VITE_PORT}:${VITE_PORT}"
    environment:
      VITE_BACKEND_URL: ${VITE_BACKEND_URL}
      VITE_PORT: ${VITE_PORT}

  celery_worker:
    image: vincent/backend:prod